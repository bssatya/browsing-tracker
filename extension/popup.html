<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browsing Behavior Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 280px;
      padding: 16px;
      background: #fff;
      color: #1a1a1a;
    }

    h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1a1a1a;
    }

    p.subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 12px 0;
    }

    button#generateBtn {
      width: 100%;
      padding: 10px 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    button#generateBtn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button#generateBtn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 18px;
      text-align: center;
    }

    #status.generating { color: #2563eb; }
    #status.success    { color: #16a34a; }
    #status.error      { color: #dc2626; }

    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid #93c5fd;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 5px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .tracking-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #16a34a;
      margin-bottom: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #16a34a;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <h2>Browsing Behavior Tracker</h2>
  <p class="subtitle">Tracking your browsing time in the background.</p>

  <div class="tracking-badge">
    <div class="dot"></div>
    Tracking active
  </div>

  <hr class="divider">

  <button id="generateBtn">Generate Historical Behavior Report</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
